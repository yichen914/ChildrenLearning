<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ryan's Violin Key Finder</title>
  <style>
    :root {
      --ink: #17202a;
      --muted: #65717d;
      --paper: #fffdf7;
      --line: #1f2933;
      --blue: #176b87;
      --blue-soft: #e7f6fb;
      --red: #b83a43;
      --border: #ccd5dc;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #eef3f5;
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    button { font: inherit; }

    .page {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.55rem, 4vw, 2.2rem);
    }

    .intro {
      margin: 6px 0 18px;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 650;
    }

    .panel {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: white;
      box-shadow: 0 12px 34px rgba(36, 54, 66, .10);
    }

    .staff-scroll {
      overflow-x: auto;
      padding: 14px;
      background: var(--paper);
    }

    .staff {
      position: relative;
      width: 100%;
      min-width: 720px;
      height: 540px;
      background: var(--paper);
      border: 1px solid #ddd8ca;
      border-radius: 12px;
      overflow: hidden;
      isolation: isolate;
    }

    .staff-line {
      position: absolute;
      left: 42px;
      right: 42px;
      height: 2px;
      background: var(--line);
      transform: translateY(-1px);
      pointer-events: none;
      z-index: 1;
    }

    .clef {
      position: absolute;
      left: 50px;
      top: 270px;
      z-index: 2;
      transform: translateY(-51%);
      color: var(--ink);
      font: 400 126px/1 "Segoe UI Symbol", "Noto Music", serif;
      pointer-events: none;
    }

    .hit {
      position: absolute;
      left: 0;
      width: 100%;
      height: 44px;
      transform: translateY(-22px);
      border: 0;
      border-radius: 0;
      background: transparent;
      cursor: pointer;
      z-index: 3;
    }

    .hit:hover,
    .hit:focus-visible {
      background: rgba(23, 107, 135, .08);
      outline: 2px solid rgba(23, 107, 135, .42);
      outline-offset: -2px;
    }

    .marker {
      position: absolute;
      z-index: 4;
      width: 18px;
      height: 24px;
      display: grid;
      place-items: center;
      transform: translate(-50%, -50%);
      color: #0b0f12;
      font: 700 17px/1 Georgia, "Times New Roman", serif;
      pointer-events: none;
    }

    .marker.flat { transform: translate(-50%, -54%); }

    .controls {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid var(--border);
      background: #f8fafb;
    }

    .controls button {
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid #9aa8b3;
      border-radius: 10px;
      background: white;
      color: var(--ink);
      font-weight: 750;
      cursor: pointer;
    }

    .controls button:hover,
    .controls button:focus-visible { border-color: var(--blue); }

    .answer {
      margin-top: 16px;
      padding: 20px 22px;
    }

    .key-name {
      margin: 0;
      color: var(--blue);
      font-size: clamp(2rem, 7vw, 3.4rem);
      line-height: 1.05;
      font-weight: 850;
      letter-spacing: .01em;
    }

    .key-name.invalid { color: var(--red); font-size: clamp(1.45rem, 5vw, 2.3rem); }

    .changes {
      margin: 15px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 7px;
    }

    .changes li {
      padding: 10px 12px;
      border-left: 4px solid var(--blue);
      background: var(--blue-soft);
      border-radius: 0 8px 8px 0;
      font-size: 1rem;
      font-weight: 700;
    }

    .simple-message {
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 650;
    }

    @media (max-width: 620px) {
      .page { padding: 12px; }
      .staff-scroll { padding: 8px; }
      .answer { padding: 17px; }
      .intro { margin-bottom: 12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Violin Key Finder</h1>
    <p class="intro">Tap a line or space: 1 tap = ♯, 2 taps = ♭, 3 taps = clear.</p>

    <section class="panel" aria-label="Choose a key signature">
      <div class="staff-scroll">
        <div class="staff" id="staff" aria-label="Interactive treble clef staff">
          <i class="staff-line" style="top:90px"></i>
          <i class="staff-line" style="top:180px"></i>
          <i class="staff-line" style="top:270px"></i>
          <i class="staff-line" style="top:360px"></i>
          <i class="staff-line" style="top:450px"></i>
          <span class="clef" aria-hidden="true">𝄞</span>
          <div id="hitLayer"></div>
          <div id="markerLayer" aria-hidden="true"></div>
        </div>
      </div>
      <div class="controls">
        <button type="button" id="undoBtn">Undo</button>
        <button type="button" id="clearBtn">Clear</button>
      </div>
    </section>

    <section class="panel answer" aria-live="polite">
      <h2 class="key-name" id="keyName">C MAJOR</h2>
      <ul class="changes" id="changes"></ul>
      <p class="simple-message" id="message">No finger changes.</p>
    </section>
  </main>

  <script>
    (() => {
      const POSITIONS = [
        { id: 'G5', letter: 'G', y: 45,  place: 'space above the staff' },
        { id: 'F5', letter: 'F', y: 90,  place: 'top line' },
        { id: 'E5', letter: 'E', y: 135, place: 'top space' },
        { id: 'D5', letter: 'D', y: 180, place: 'fourth line' },
        { id: 'C5', letter: 'C', y: 225, place: 'third space' },
        { id: 'B4', letter: 'B', y: 270, place: 'middle line' },
        { id: 'A4', letter: 'A', y: 315, place: 'second space' },
        { id: 'G4', letter: 'G', y: 360, place: 'second line' },
        { id: 'F4', letter: 'F', y: 405, place: 'bottom space' },
        { id: 'E4', letter: 'E', y: 450, place: 'bottom line' }
      ];

      const RULES = {
        sharp: {
          symbol: '♯',
          positions: ['F5', 'C5', 'G5', 'D5', 'A4', 'E5', 'B4'],
          keys: ['C', 'G', 'D', 'A', 'E', 'B', 'F♯', 'C♯']
        },
        flat: {
          symbol: '♭',
          positions: ['B4', 'E5', 'A4', 'D5', 'G4', 'C5', 'F4'],
          keys: ['C', 'F', 'B♭', 'E♭', 'A♭', 'D♭', 'G♭', 'C♭']
        }
      };

      const NATURAL = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
      const STRINGS = [
        { name: 'G', pitch: 7 },
        { name: 'D', pitch: 2 },
        { name: 'A', pitch: 9 },
        { name: 'E', pitch: 4 }
      ];
      const FINGERS = {
        G: ['OPEN', '1', '1', '2', '2', '3', '3', '4'],
        D: ['OPEN', '1', '1', '2', '2', '3', '3', '4'],
        A: ['OPEN', '1', '1', '2', '2', '3', '3', '4'],
        E: ['OPEN', '1', '1', '2', '2', '3', '3', '4']
      };

      const hitLayer = document.querySelector('#hitLayer');
      const markerLayer = document.querySelector('#markerLayer');
      const keyName = document.querySelector('#keyName');
      const changes = document.querySelector('#changes');
      const message = document.querySelector('#message');
      const undoBtn = document.querySelector('#undoBtn');
      const clearBtn = document.querySelector('#clearBtn');

      let selected = new Map();
      let history = [];

      function remember() {
        history.push(new Map(selected));
        if (history.length > 40) history.shift();
      }

      function cycle(id) {
        remember();
        const value = selected.get(id);
        if (!value) selected.set(id, 'sharp');
        else if (value === 'sharp') selected.set(id, 'flat');
        else selected.delete(id);
        render();
      }

      function detectKey() {
        if (selected.size === 0) return { valid: true, name: 'C', type: null, count: 0 };
        const types = new Set(selected.values());
        if (types.size !== 1) return { valid: false };

        const type = [...types][0];
        const rule = RULES[type];
        const chosen = new Set(selected.keys());
        const expected = rule.positions.slice(0, chosen.size);
        const valid = chosen.size <= rule.positions.length &&
          expected.every(id => chosen.has(id));

        return valid
          ? { valid: true, name: rule.keys[chosen.size], type, count: chosen.size }
          : { valid: false };
      }

      function fingerChanges(type, count) {
        if (!type || count === 0) return [];
        const rule = RULES[type];
        const direction = type === 'sharp' ? 'HIGHER / SHARPER' : 'LOWER / FLATTER';
        const rows = [];

        rule.positions.slice(0, count).forEach(positionId => {
          const position = POSITIONS.find(item => item.id === positionId);
          const pitch = (NATURAL[position.letter] + (type === 'sharp' ? 1 : -1) + 12) % 12;
          const note = position.letter + rule.symbol;

          STRINGS.forEach(string => {
            const distance = (pitch - string.pitch + 12) % 12;
            if (distance > 7) return;
            const finger = FINGERS[string.name][distance];
            rows.push(finger === 'OPEN'
              ? `${string.name} string · OPEN STRING · ${note}`
              : `${string.name} string · finger ${finger} · ${direction} · ${note}`);
          });
        });

        return rows;
      }

      function renderStaff() {
        markerLayer.replaceChildren();
        const ordered = [...selected.keys()];

        ordered.forEach((id, index) => {
          const position = POSITIONS.find(item => item.id === id);
          const type = selected.get(id);
          const marker = document.createElement('span');
          marker.className = `marker ${type}`;
          marker.style.left = `${145 + index * 28}px`;
          marker.style.top = `${position.y}px`;
          marker.textContent = RULES[type].symbol;
          markerLayer.append(marker);
        });

        POSITIONS.forEach(position => {
          const button = hitLayer.querySelector(`[data-id="${position.id}"]`);
          const type = selected.get(position.id);
          button.setAttribute(
            'aria-label',
            `${position.id}, ${position.place}. ${type ? RULES[type].symbol : 'no accidental'}. Tap to change.`
          );
        });
      }

      function renderAnswer() {
        const result = detectKey();
        changes.replaceChildren();

        if (!result.valid) {
          keyName.textContent = 'NOT A MAJOR KEY SIGNATURE';
          keyName.classList.add('invalid');
          message.textContent = 'Change one of the positions.';
          return;
        }

        keyName.textContent = `${result.name} MAJOR`;
        keyName.classList.remove('invalid');
        const rows = fingerChanges(result.type, result.count);
        message.textContent = rows.length ? '' : 'No finger changes.';
        rows.forEach(text => {
          const item = document.createElement('li');
          item.textContent = text;
          changes.append(item);
        });
      }

      function render() {
        renderStaff();
        renderAnswer();
      }

      POSITIONS.forEach(position => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'hit';
        button.dataset.id = position.id;
        button.style.top = `${position.y}px`;
        button.addEventListener('click', () => cycle(position.id));
        hitLayer.append(button);
      });

      undoBtn.addEventListener('click', () => {
        if (!history.length) return;
        selected = history.pop();
        render();
      });

      clearBtn.addEventListener('click', () => {
        if (!selected.size) return;
        remember();
        selected.clear();
        render();
      });

      window.__violinKeyFinder = { detectKey, fingerChanges, positions: POSITIONS, rules: RULES };
      render();
    })();
  </script>
</body>
</html>
